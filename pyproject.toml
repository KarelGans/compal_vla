[project]
name = "open-box-vla"
version = "0.1.0"
description = "pi0.5 (LeRobot) fine-tuning for opening box flaps with the igus ReBeL dual-arm setup"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lerobot[pi,dataset,training]==0.7.0",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_box_vla"]
